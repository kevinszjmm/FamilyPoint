<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>🏠 家庭积分</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 10px; }
    .container { max-width: 500px; margin: 0 auto; }
    
    /* 登录页面 */
    .auth-page { background: white; border-radius: 20px; padding: 30px 20px; margin-top: 50px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
    .auth-title { text-align: center; font-size: 1.8em; margin-bottom: 30px; color: #333; }
    .auth-title span { font-size: 2em; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #555; }
    .form-group input, .form-group select { width: 100%; padding: 14px; border: 2px solid #e0e0e0; border-radius: 12px; font-size: 16px; transition: border-color 0.3s; }
    .form-group input:focus, .form-group select:focus { border-color: #667eea; outline: none; }
    .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; transition: transform 0.2s; }
    .btn:active { transform: scale(0.98); }
    .btn-secondary { background: #f0f0f0; color: #666; margin-top: 10px; }
    .auth-switch { text-align: center; margin-top: 20px; color: #888; }
    .auth-switch a { color: #667eea; text-decoration: none; }
    
    /* 主应用 */
    .app-page { display: none; }
    .header { color: white; text-align: center; padding: 15px 0; margin-bottom: 15px; }
    .header h1 { font-size: 1.5em; }
    .header .family-name { font-size: 0.9em; opacity: 0.8; }
    .tabs { display: flex; gap: 8px; margin-bottom: 15px; overflow-x: auto; padding-bottom: 5px; flex-wrap: wrap; }
    .tab { flex-shrink: 0; padding: 10px 16px; background: rgba(255,255,255,0.2); border: none; border-radius: 10px; color: white; font-size: 14px; cursor: pointer; transition: all 0.3s; }
    .tab.active { background: white; color: #667eea; }
    .panel { display: none; background: white; border-radius: 16px; padding: 20px 15px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); margin-bottom: 15px; }
    .panel.active { display: block; }
    .section-title { font-size: 1.2em; margin-bottom: 15px; color: #333; }
    
    /* 头像 */
    .avatar { width: 45px; height: 45px; border-radius: 50%; background: #667eea; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.5em; }
    .avatar.large { width: 60px; height: 60px; font-size: 2em; }
    
    /* 头像选择器 */
    .avatar-picker { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 10px 0; }
    .avatar-option { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5em; cursor: pointer; border: 3px solid transparent; transition: all 0.2s; }
    .avatar-option:hover { transform: scale(1.1); }
    .avatar-option.selected { border-color: #667eea; }
    
    /* 排行榜 */
    .champion { text-align: center; padding: 20px; background: linear-gradient(135deg, #ffd700 0%, #ffec8b 100%); border-radius: 15px; margin-bottom: 20px; }
    .champion-title { font-size: 1em; margin-bottom: 5px; }
    .champion-name { font-size: 2em; font-weight: bold; color: #333; }
    .champion-points { font-size: 1em; color: #666; }
    .ranking-list { display: flex; flex-direction: column; gap: 10px; }
    .ranking-item { display: flex; align-items: center; padding: 15px; background: #f8f9fa; border-radius: 12px; }
    .ranking-item.first { background: linear-gradient(135deg, #ffd700 0%, #ffec8b 100%); }
    .rank-number { font-size: 1.5em; width: 40px; text-align: center; }
    .member-info { flex: 1; }
    .member-name { font-weight: bold; }
    .member-points { font-size: 1.3em; color: #667eea; font-weight: bold; }
    
    /* 卡片网格 */
    .card-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 20px; }
    .card { background: #f8f9fa; border-radius: 12px; padding: 15px; text-align: center; }
    .card-title { font-weight: bold; margin-bottom: 5px; }
    .card-points { font-size: 1.5em; color: #667eea; font-weight: bold; }
    .card-category { font-size: 0.8em; color: #888; }
    
    /* 成员卡片 */
    .member-card { background: #f8f9fa; border-radius: 12px; padding: 15px; }
    .member-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .member-card-name { font-weight: bold; font-size: 1.1em; }
    .member-card-points { color: #667eea; font-weight: bold; }
    .member-card-edit { margin-left: auto; font-size: 0.8em; color: #888; cursor: pointer; }
    
    /* 完成记录 */
    .completion-list { display: flex; flex-direction: column; gap: 8px; }
    .completion-item { display: flex; align-items: center; justify-content: space-between; padding: 12px; background: #f8f9fa; border-radius: 10px; font-size: 14px; }
    .completion-info { display: flex; flex-direction: column; gap: 3px; }
    .completion-points { font-weight: bold; color: #667eea; }
    .delete-btn { padding: 5px 10px; background: #ff6b6b; color: white; border: none; border-radius: 6px; font-size: 12px; cursor: pointer; }
    
    /* 日期选择 */
    .date-row { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
    .date-row input { flex: 1; padding: 10px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 14px; }
    
    /* 兑换卡片 */
    .reward-card { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border-radius: 12px; padding: 15px; text-align: center; }
    .reward-card .card-title { color: white; }
    .reward-card .card-points { color: #ffd700; }
    .reward-stock { font-size: 0.8em; opacity: 0.8; }
    
    /* 按人分组 */
    .member-group { background: #f8f9fa; border-radius: 12px; margin-bottom: 15px; overflow: hidden; }
    .member-group-header { display: flex; align-items: center; padding: 15px; background: #e8e8e8; gap: 10px; }
    .member-group-name { font-weight: bold; flex: 1; }
    .member-group-points { color: #667eea; font-weight: bold; }
    .member-group-body { padding: 10px; }
    .task-summary { display: flex; justify-content: space-between; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 14px; }
    .task-summary:last-child { border-bottom: none; }
    
    /* 表单按钮 */
    .btn-small { width: auto; padding: 10px 20px; display: inline-block; }
    .btn-danger { background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%); }
    .btn-edit { background: #667eea; margin-right: 5px; }
    
    /* 空状态 */
    .empty-state { text-align: center; padding: 30px; color: #888; }
    .empty-state-icon { font-size: 3em; margin-bottom: 10px; }
    
    /* 退出按钮 */
    .logout-btn { position: fixed; bottom: 20px; right: 20px; width: 50px; height: 50px; background: rgba(255,255,255,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.5em; box-shadow: 0 5px 20px rgba(0,0,0,0.2); cursor: pointer; z-index: 100; }
    
    hr { margin: 20px 0; border: none; border-top: 1px solid #eee; }
    
    /* Toast */
    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 24px; border-radius: 10px; z-index: 1000; opacity: 0; transition: opacity 0.3s; }
    .toast.show { opacity: 1; }
    
    /* 模态框 */
    .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 200; }
    .modal-content { background: white; border-radius: 16px; padding: 20px; width: 90%; max-width: 400px; }
    .modal-title { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 15px; }
    .modal-actions .btn { flex: 1; }
  </style>
</head>
<body>
  <div class="container">
    <!-- 登录/注册页面 -->
    <div id="auth-page" class="auth-page">
      <div class="auth-title"><span>🏠</span><br>家庭积分系统</div>
      <div id="login-form">
        <div class="form-group"><label>用户名</label><input type="text" id="login-username" placeholder="输入用户名"></div>
        <div class="form-group"><label>密码</label><input type="password" id="login-password" placeholder="输入密码"></div>
        <button class="btn" onclick="login()">登录</button>
        <button class="btn btn-secondary" onclick="showRegister()">没有账号？去注册</button>
      </div>
      <div id="register-form" style="display: none;">
        <div class="form-group"><label>用户名</label><input type="text" id="reg-username" placeholder="设置用户名"></div>
        <div class="form-group"><label>密码</label><input type="password" id="reg-password" placeholder="设置密码"></div>
        <div class="form-group"><label>家庭名称（可选）</label><input type="text" id="reg-family" placeholder="例如：幸福之家"></div>
        <button class="btn" onclick="register()">注册</button>
        <button class="btn btn-secondary" onclick="showLogin()">已有账号？去登录</button>
      </div>
    </div>
    
    <!-- 主应用 -->
    <div id="app-page" class="app-page">
      <div class="header">
        <h1>🏠 家庭积分</h1>
        <div class="family-name" id="family-name"></div>
      </div>
      
      <div class="tabs">
        <button class="tab active" onclick="showPanel('ranking')">📊 排行</button>
        <button class="tab" onclick="showPanel('record')">✅ 记录</button>
        <button class="tab" onclick="showPanel('members')">👤 成员</button>
        <button class="tab" onclick="showPanel('tasks')">📋 任务</button>
        <button class="tab" onclick="showPanel('exchange')">🎁 兑换</button>
        <button class="tab" onclick="showPanel('history')">📜 历史</button>
      </div>
      
      <!-- 排行榜 -->
      <div id="ranking-panel" class="panel active">
        <div class="section-title">🏆 本周排行</div>
        <div id="champion"></div>
        <div id="weekly-ranking" class="ranking-list"></div>
        <hr>
        <div class="section-title">📈 总排行</div>
        <div id="total-ranking" class="ranking-list"></div>
      </div>
      
      <!-- 记录完成 -->
      <div id="record-panel" class="panel">
        <div class="section-title">✅ 记录完成</div>
        <div class="date-row">
          <label>日期：</label>
          <input type="date" id="completion-date">
        </div>
        <div class="form-group">
          <label>成员</label>
          <select id="select-member" style="width:100%;padding:12px;border-radius:10px;border:2px solid #e0e0e0;font-size:16px;"></select>
        </div>
        <div class="form-group">
          <label>任务</label>
          <select id="select-task" style="width:100%;padding:12px;border-radius:10px;border:2px solid #e0e0e0;font-size:16px;"></select>
        </div>
        <div class="form-group">
          <label>备注</label>
          <input type="text" id="completion-note" placeholder="可选">
        </div>
        <button class="btn btn-small" onclick="addCompletion()">✅ 记录</button>
        <hr>
        <div class="section-title">📝 今日记录</div>
        <div id="today-completions" class="completion-list"></div>
      </div>
      
      <!-- 成员管理 -->
      <div id="members-panel" class="panel">
        <div class="section-title">👤 家庭成员</div>
        <div class="form-group"><input type="text" id="new-member-name" placeholder="成员名称"></div>
        <div class="form-group">
          <label>选择头像</label>
          <div class="avatar-picker" id="avatar-picker"></div>
        </div>
        <button class="btn btn-small" onclick="addMember()">➕ 添加</button>
        <hr>
        <div id="members-list" class="card-grid"></div>
      </div>
      
      <!-- 任务管理 -->
      <div id="tasks-panel" class="panel">
        <div class="section-title">📋 积分任务</div>
        <div class="form-group"><input type="text" id="new-task-name" placeholder="任务名称"></div>
        <div class="form-group"><input type="number" id="new-task-points" placeholder="积分" value="10"></div>
        <div class="form-group">
          <select id="new-task-category" style="width:100%;padding:12px;border-radius:10px;border:2px solid #e0e0e0;font-size:16px;">
            <option value="日常">日常</option>
            <option value="家务">家务</option>
            <option value="学习">学习</option>
            <option value="运动">运动</option>
            <option value="其他">其他</option>
          </select>
        </div>
        <button class="btn btn-small" onclick="addTask()">➕ 添加</button>
        <hr>
        <div id="tasks-list" class="card-grid"></div>
      </div>
      
      <!-- 积分兑换 -->
      <div id="exchange-panel" class="panel">
        <div class="section-title">🎁 积分兑换</div>
        <div class="form-group"><input type="text" id="new-reward-name" placeholder="奖励名称，如：看动画片30分钟"></div>
        <div class="form-group"><input type="number" id="new-reward-points" placeholder="所需积分" value="100"></div>
        <div class="form-group"><input type="number" id="new-reward-stock" placeholder="库存（-1表示无限）" value="-1"></div>
        <button class="btn btn-small" onclick="addReward()">➕ 添加奖励</button>
        <hr>
        <div class="section-title">🎯 可兑换奖励</div>
        <div id="rewards-list" class="card-grid"></div>
        <hr>
        <div class="section-title">📜 兑换历史</div>
        <div id="redemptions-list"></div>
      </div>
      
      <!-- 历史记录 -->
      <div id="history-panel" class="panel">
        <div class="section-title">📜 历史记录</div>
        <div class="date-row">
          <input type="date" id="history-start">
          <span>至</span>
          <input type="date" id="history-end">
        </div>
        <button class="btn btn-small" onclick="loadHistory()">查询</button>
        <hr>
        <div id="history-list"></div>
      </div>
      
      <div class="logout-btn" onclick="logout()">🚪</div>
    </div>
  </div>
  
  <!-- 编辑成员模态框 -->
  <div id="edit-member-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-title">编辑成员</div>
      <input type="hidden" id="edit-member-id">
      <div class="form-group"><label>名称</label><input type="text" id="edit-member-name"></div>
      <div class="form-group"><label>头像</label><div class="avatar-picker" id="edit-avatar-picker"></div></div>
      <div class="modal-actions">
        <button class="btn btn-danger" onclick="deleteMemberConfirm()">删除</button>
        <button class="btn btn-edit" onclick="saveMember()">保存</button>
      </div>
    </div>
  </div>
  
  <!-- 兑换模态框 -->
  <div id="redeem-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-title">🎁 兑换奖励</div>
      <input type="hidden" id="redeem-reward-id">
      <div class="form-group"><label>奖励</label><div id="redeem-reward-name" style="font-weight:bold;padding:10px;background:#f8f9fa;border-radius:8px;"></div></div>
      <div class="form-group"><label>所需积分</label><div id="redeem-points" style="font-weight:bold;color:#667eea;"></div></div>
      <div class="form-group">
        <label>谁来兑换</label>
        <select id="redeem-member" style="width:100%;padding:12px;border-radius:10px;border:2px solid #e0e0e0;font-size:16px;"></select>
      </div>
      <div class="modal-actions">
        <button class="btn btn-secondary" onclick="closeRedeemModal()">取消</button>
        <button class="btn" onclick="confirmRedeem()">确认兑换</button>
      </div>
    </div>
  </div>
  
  <div class="toast" id="toast"></div>
  
  <script>
    const AVATARS = ['👶', '👦', '👧', '👨', '👩', '👴', '👵', '🧑', '👱', '🤴', '👸', '🐱', '🐶', '🐰', '🦊', '🐼', '🐨', '🦁', '🐸', '🦋'];
    
    let token = localStorage.getItem('token');
    let currentMembers = [];
    let selectedAvatar = AVATARS[0];
    
    const API = {
      register: '/api/register', login: '/api/login', logout: '/api/logout', me: '/api/me',
      members: '/api/members', tasks: '/api/tasks', completions: '/api/completions', rewards: '/api/rewards',
      redemptions: '/api/redemptions',
      stats: { total: '/api/stats/total', weekly: '/api/stats/weekly', lastWeek: '/api/stats/last-week' }
    };
    
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      setTimeout(() => el.classList.remove('show'), 2000);
    }
    
    async function authFetch(url, options = {}) {
      options.headers = options.headers || {};
      options.headers['Authorization'] = `Bearer ${token}`;
      const res = await fetch(url, options);
      if (res.status === 401) { logout(); return null; }
      return res;
    }
    
    function initAvatarPicker(containerId, selected, onSelect) {
      const container = document.getElementById(containerId);
      container.innerHTML = AVATARS.map(a => `<div class="avatar-option ${a === selected ? 'selected' : ''}" onclick="selectAvatar('${a}', '${containerId}')">${a}</div>`).join('');
      if (onSelect) container.onSelect = onSelect;
    }
    
    window.selectAvatar = function(avatar, containerId) {
      document.querySelectorAll(`#${containerId} .avatar-option`).forEach(el => el.classList.remove('selected'));
      event.target.classList.add('selected');
      if (containerId === 'avatar-picker') {
        selectedAvatar = avatar;
      } else if (containerId === 'edit-avatar-picker') {
        document.getElementById('edit-avatar-picker').dataset.selected = avatar;
      }
    };
    
    document.addEventListener('DOMContentLoaded', async () => {
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('completion-date').value = today;
      document.getElementById('history-start').value = new Date(Date.now() - 7 * 24 * 60 * 60 * 1000).toISOString().split('T')[0];
      document.getElementById('history-end').value = today;
      initAvatarPicker('avatar-picker', selectedAvatar);
      
      if (token) {
        const res = await authFetch(API.me);
        if (res) {
          const user = await res.json();
          if (user.id) { showApp(user); return; }
        }
      }
      showAuth();
    });
    
    function showAuth() {
      document.getElementById('auth-page').style.display = 'block';
      document.getElementById('app-page').style.display = 'none';
    }
    
    function showApp(user) {
      document.getElementById('auth-page').style.display = 'none';
      document.getElementById('app-page').style.display = 'block';
      document.getElementById('family-name').textContent = user.familyName || user.username;
      loadAll();
    }
    
    function showLogin() {
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('register-form').style.display = 'none';
    }
    
    function showRegister() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('register-form').style.display = 'block';
    }
    
    async function login() {
      const username = document.getElementById('login-username').value.trim();
      const password = document.getElementById('login-password').value;
      if (!username || !password) return toast('请输入用户名和密码');
      
      const res = await fetch(API.login, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
      const data = await res.json();
      if (data.success) {
        token = data.token;
        localStorage.setItem('token', token);
        showApp(data.user);
        toast('登录成功');
      } else { toast(data.error); }
    }
    
    async function register() {
      const username = document.getElementById('reg-username').value.trim();
      const password = document.getElementById('reg-password').value;
      const familyName = document.getElementById('reg-family').value.trim();
      if (!username || !password) return toast('请输入用户名和密码');
      
      const res = await fetch(API.register, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password, familyName }) });
      const data = await res.json();
      if (data.success) { toast('注册成功，请登录'); showLogin(); } else { toast(data.error); }
    }
    
    function logout() { token = null; localStorage.removeItem('token'); showAuth(); toast('已退出'); }
    
    function showPanel(name) {
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById(`${name}-panel`).classList.add('active');
      event.target.classList.add('active');
      if (name === 'history') loadHistory();
      if (name === 'exchange') loadRewards();
    }
    
    async function loadAll() {
      await Promise.all([loadMembers(), loadTasks(), loadRanking(), loadTodayCompletions()]);
    }
    
    async function loadRanking() {
      const [weekly, total] = await Promise.all([
        authFetch(API.stats.weekly).then(r => r?.json()),
        authFetch(API.stats.total).then(r => r?.json())
      ]);
      if (!weekly || !total) return;
      
      const championEl = document.getElementById('champion');
      const weeklyEl = document.getElementById('weekly-ranking');
      
      if (weekly.ranking?.length > 0 && weekly.ranking[0].total_points > 0) {
        const winner = weekly.ranking[0];
        championEl.innerHTML = `<div class="champion"><div class="champion-title">🏆 本周冠军</div><div class="champion-name">${winner.name}</div><div class="champion-points">${winner.total_points} 分</div></div>`;
        weeklyEl.innerHTML = weekly.ranking.map((m, i) => `
          <div class="ranking-item ${i === 0 ? 'first' : ''}">
            <div class="rank-number">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</div>
            <div class="avatar" style="margin-right:12px;">${winner.avatar || m.name[0]}</div>
            <div class="member-info"><div class="member-name">${m.name}</div></div>
            <div class="member-points">${m.total_points}分</div>
          </div>`).join('');
      } else {
        championEl.innerHTML = '';
        weeklyEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📊</div>暂无数据</div>';
      }
      
      const totalEl = document.getElementById('total-ranking');
      totalEl.innerHTML = total.map((m, i) => `
        <div class="ranking-item ${i === 0 ? 'first' : ''}">
          <div class="rank-number">${i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : i + 1}</div>
          <div class="avatar" style="margin-right:12px;">${m.avatar || m.name[0]}</div>
          <div class="member-info">
            <div class="member-name">${m.name}</div>
            ${m.spent_points > 0 ? `<div style="font-size:11px;color:#888;">已兑换 ${m.spent_points}分</div>` : ''}
          </div>
          <div class="member-points">${m.total_points}分</div>
        </div>`).join('');
    }
    
    async function loadMembers() {
      currentMembers = await authFetch(API.members).then(r => r?.json()) || [];
      const select = document.getElementById('select-member');
      if (currentMembers.length > 0 && select.options.length === 0) {
        select.innerHTML = currentMembers.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
      }
      
      const list = document.getElementById('members-list');
      if (currentMembers.length > 0) {
        list.innerHTML = currentMembers.map(m => `
          <div class="member-card">
            <div class="member-card-header">
              <div class="avatar">${m.avatar || m.name[0]}</div>
              <div class="member-card-name">${m.name}</div>
              <div class="member-card-edit" onclick="openEditMember(${m.id}, '${m.name}', '${m.avatar || m.name[0]}')">编辑</div>
            </div>
          </div>`).join('');
      } else {
        list.innerHTML = '<div class="empty-state" style="grid-column:span 2;"><div class="empty-state-icon">👤</div>添加家庭成员</div>';
      }
      
      // 更新兑换模态框的成员选择
      const redeemMember = document.getElementById('redeem-member');
      if (redeemMember && currentMembers.length > 0) {
        redeemMember.innerHTML = currentMembers.map(m => `<option value="${m.id}">${m.name}</option>`).join('');
      }
    }
    
    async function loadTasks() {
      const tasks = await authFetch(API.tasks).then(r => r?.json()) || [];
      const select = document.getElementById('select-task');
      if (tasks.length > 0 && select.options.length === 0) {
        select.innerHTML = tasks.map(t => `<option value="${t.id}">${t.name} (+${t.points})</option>`).join('');
      }
      
      const list = document.getElementById('tasks-list');
      if (tasks.length > 0) {
        list.innerHTML = tasks.map(t => `
          <div class="card">
            <div class="card-title">${t.name}</div>
            <div class="card-points">+${t.points}</div>
            <div class="card-category">${t.category}</div>
            <button class="delete-btn" style="margin-top:8px;" onclick="deleteTask(${t.id})">删除</button>
          </div>`).join('');
      } else {
        list.innerHTML = '<div class="empty-state" style="grid-column:span 2;"><div class="empty-state-icon">📋</div>添加积分任务</div>';
      }
    }
    
    async function loadRewards() {
      try {
        const res = await authFetch(API.rewards);
        if (!res) {
          console.error('❌ loadRewards: authFetch 返回 null');
          return;
        }
        
        const rewards = await res.json();
        console.log('✅ 加载奖励:', rewards);
        
        const list = document.getElementById('rewards-list');
        
        if (rewards.length > 0) {
          list.innerHTML = rewards.map(r => {
            const stockText = r.stock === -1 ? '∞' : `剩余 ${r.stock}`;
            const disabled = r.stock === 0 ? 'opacity:0.5;pointer-events:none;' : '';
            return `
            <div class="reward-card" style="${disabled}">
              <div class="card-title">${r.name}</div>
              <div class="card-points">${r.points_cost} 积分</div>
              <div class="reward-stock">${stockText}</div>
              <button class="delete-btn" style="margin-top:8px;background:rgba(255,255,255,0.3);" onclick="openRedeemModal(${r.id}, '${r.name}', ${r.points_cost}, ${r.stock})">兑换</button>
              <button class="delete-btn" style="margin-top:5px;" onclick="deleteReward(${r.id})">删除</button>
            </div>`;
          }).join('');
        } else {
          list.innerHTML = '<div class="empty-state" style="grid-column:span 2;"><div class="empty-state-icon">🎁</div>添加积分奖励</div>';
        }
        
        // 同时加载兑换历史
        await loadRedemptions();
      } catch (e) {
        console.error('❌ loadRewards 错误:', e);
      }
    }
    
    async function loadTodayCompletions() {
      const date = document.getElementById('completion-date').value;
      const completions = await authFetch(`${API.completions}?date=${date}`).then(r => r?.json()) || [];
      const members = await authFetch(API.members).then(r => r?.json()) || [];
      
      const list = document.getElementById('today-completions');
      
      if (completions.length === 0) {
        list.innerHTML = '<div class="empty-state">暂无记录</div>';
        return;
      }
      
      // 按成员分组
      const grouped = {};
      completions.forEach(c => {
        if (!grouped[c.member_id]) {
          grouped[c.member_id] = { name: c.member_name, avatar: members.find(m => m.id === c.member_id)?.avatar || c.member_name[0], items: [] };
        }
        grouped[c.member_id].items.push(c);
      });
      
      list.innerHTML = Object.entries(grouped).map(([memberId, member]) => `
        <div class="member-group">
          <div class="member-group-header">
            <div class="avatar">${member.avatar}</div>
            <div class="member-group-name">${member.name}</div>
            <div class="member-group-points">+${member.items.reduce((sum, c) => sum + c.points, 0)}分</div>
          </div>
          <div class="member-group-body">
            ${member.items.map(c => `
              <div class="task-summary">
                <span>${c.task_name} ${c.note ? `<span style="color:#888;">(${c.note})</span>` : ''}</span>
                <span style="display:flex;align-items:center;gap:8px;">
                  +${c.points}分
                  <button class="delete-btn" style="padding:2px 6px;font-size:11px;" onclick="deleteCompletion(${c.id})">✕</button>
                </span>
              </div>`).join('')}
          </div>
        </div>`).join('');
    }
    
    async function loadRedemptions() {
      const redemptions = await authFetch(API.redemptions).then(r => r?.json()) || [];
      const list = document.getElementById('redemptions-list');
      
      if (redemptions.length === 0) {
        list.innerHTML = '<div class="empty-state">暂无兑换记录</div>';
        return;
      }
      
      list.innerHTML = redemptions.map(r => `
        <div class="completion-item">
          <div class="completion-info">
            <span><strong>${r.member_name}</strong> 兑换了 <strong>${r.reward_name}</strong></span>
            <span style="color:#888;font-size:12px;">${r.redeemed_at}</span>
          </div>
          <span class="completion-points" style="color:#ff6b6b;">-${r.points_spent}分</span>
        </div>`).join('');
    }
    
    async function addMember() {
      const name = document.getElementById('new-member-name').value.trim();
      if (!name) return toast('请输入名称');
      
      await authFetch(API.members, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, avatar: selectedAvatar }) });
      document.getElementById('new-member-name').value = '';
      selectedAvatar = AVATARS[0];
      initAvatarPicker('avatar-picker', selectedAvatar);
      await loadMembers();
      await loadRanking();
      await loadTodayCompletions();
      toast('添加成功');
    }
    
    function openEditMember(id, name, avatar) {
      document.getElementById('edit-member-id').value = id;
      document.getElementById('edit-member-name').value = name;
      document.getElementById('edit-avatar-picker').dataset.selected = avatar || name[0];
      initAvatarPicker('edit-avatar-picker', avatar || name[0]);
      document.getElementById('edit-member-modal').style.display = 'flex';
    }
    
    async function saveMember() {
      const id = document.getElementById('edit-member-id').value;
      const name = document.getElementById('edit-member-name').value.trim();
      const avatar = document.getElementById('edit-avatar-picker').dataset.selected || name[0];
      if (!name) return toast('请输入名称');
      await authFetch(`${API.members}/${id}`, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, avatar }) });
      document.getElementById('edit-member-modal').style.display = 'none';
      await loadMembers();
      await loadRanking();
      toast('保存成功');
    }
    
    async function deleteMemberConfirm() {
      const id = document.getElementById('edit-member-id').value;
      if (!confirm('确定删除该成员？相关的积分记录也会删除。')) return;
      await authFetch(`${API.members}/${id}`, { method: 'DELETE' });
      document.getElementById('edit-member-modal').style.display = 'none';
      await loadMembers();
      await loadRanking();
      toast('已删除');
    }
    
    async function deleteMember(id) {
      if (!confirm('确定删除？')) return;
      await authFetch(`${API.members}/${id}`, { method: 'DELETE' });
      await loadMembers();
      await loadRanking();
    }
    
    async function addTask() {
      const name = document.getElementById('new-task-name').value.trim();
      const points = parseInt(document.getElementById('new-task-points').value) || 10;
      const category = document.getElementById('new-task-category').value;
      if (!name) return toast('请输入任务名称');
      await authFetch(API.tasks, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name, points, category }) });
      document.getElementById('new-task-name').value = '';
      await loadTasks();
      await loadTodayCompletions();
      toast('添加成功');
    }
    
    async function deleteTask(id) {
      if (!confirm('确定删除？')) return;
      await authFetch(`${API.tasks}/${id}`, { method: 'DELETE' });
      await loadTasks();
      await loadTodayCompletions();
    }
    
    async function addCompletion() {
      const memberId = document.getElementById('select-member').value;
      const taskId = document.getElementById('select-task').value;
      const date = document.getElementById('completion-date').value;
      const note = document.getElementById('completion-note').value.trim();
      if (!memberId || !taskId) return toast('请选择成员和任务');
      await authFetch(API.completions, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ memberId, taskId, date, note }) });
      document.getElementById('completion-note').value = '';
      await Promise.all([loadRanking(), loadTodayCompletions()]);
      toast('记录成功');
    }
    
    async function deleteCompletion(id) {
      await authFetch(`${API.completions}/${id}`, { method: 'DELETE' });
      await Promise.all([loadRanking(), loadTodayCompletions()]);
    }
    
    async function addReward() {
      const name = document.getElementById('new-reward-name').value.trim();
      const pointsCost = parseInt(document.getElementById('new-reward-points').value) || 100;
      const stock = parseInt(document.getElementById('new-reward-stock').value) ?? -1;
      if (!name) return toast('请输入奖励名称');
      
      try {
        const res = await authFetch(API.rewards, { 
          method: 'POST', 
          headers: { 'Content-Type': 'application/json' }, 
          body: JSON.stringify({ name, pointsCost, stock }) 
        });
        
        if (!res) {
          console.error('❌ authFetch 返回 null，可能是 401');
          return toast('登录已过期，请重新登录');
        }
        
        const data = await res.json();
        console.log('✅ 添加奖励响应:', data);
        
        if (!data.success) {
          return toast(data.error || '添加失败');
        }
        
        document.getElementById('new-reward-name').value = '';
        document.getElementById('new-reward-points').value = '100';
        document.getElementById('new-reward-stock').value = '-1';
        
        await loadRewards();
        toast('添加成功');
      } catch (e) {
        console.error('❌ addReward 错误:', e);
        toast('添加失败：' + e.message);
      }
    }
    
    async function deleteReward(id) {
      if (!confirm('确定删除？')) return;
      await authFetch(`${API.rewards}/${id}`, { method: 'DELETE' });
      await loadRewards();
    }
    
    function openRedeemModal(id, name, points, stock) {
      document.getElementById('redeem-reward-id').value = id;
      document.getElementById('redeem-reward-name').textContent = name;
      document.getElementById('redeem-points').textContent = points + ' 积分';
      document.getElementById('redeem-modal').style.display = 'flex';
      
      // 加载成员积分
      authFetch(API.stats.total).then(r => r?.json()).then(pointsData => {
        if (!pointsData || currentMembers.length === 0) return;
        document.getElementById('redeem-member').innerHTML = currentMembers.map(m => {
          const memberPoints = pointsData.find(p => p.id === m.id);
          const pointText = memberPoints ? `${memberPoints.total_points}分可用` : '--';
          const enough = memberPoints && memberPoints.total_points >= points;
          const disabled = enough ? '' : 'disabled title="积分不足"';
          return `<option value="${m.id}" ${disabled}>${m.avatar || m.name[0]} ${m.name}（${pointText}）</option>`;
        }).join('');
      });
    }
    
    function closeRedeemModal() {
      document.getElementById('redeem-modal').style.display = 'none';
    }
    
    async function confirmRedeem() {
      const rewardId = document.getElementById('redeem-reward-id').value;
      const memberId = document.getElementById('redeem-member').value;
      if (!memberId) return toast('请选择成员');
      const res = await authFetch(API.redemptions, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ memberId, rewardId }) });
      if (!res) return;
      const data = await res.json();
      if (data.success) {
        toast('兑换成功！');
        closeRedeemModal();
        await Promise.all([loadRewards(), loadRanking()]);
      } else {
        toast(data.error || '兑换失败');
      }
    }
    
    async function loadHistory() {
      const start = document.getElementById('history-start').value;
      const end = document.getElementById('history-end').value;
      const completions = await authFetch(`${API.completions}?startDate=${start}&endDate=${end}`).then(r => r?.json()) || [];
      const members = await authFetch(API.members).then(r => r?.json()) || [];
      const list = document.getElementById('history-list');
      
      if (completions.length === 0) {
        list.innerHTML = '<div class="empty-state"><div class="empty-state-icon">📜</div>暂无记录</div>';
        return;
      }
      
      // 按成员分组
      const grouped = {};
      members.forEach(m => { grouped[m.id] = { name: m.name, avatar: m.avatar || m.name[0], tasks: {} }; });
      completions.forEach(c => {
        if (!grouped[c.member_id]) return;
        const key = c.task_name;
        if (!grouped[c.member_id].tasks[key]) {
          grouped[c.member_id].tasks[key] = { count: 0, points: 0, category: c.category };
        }
        grouped[c.member_id].tasks[key].count++;
        grouped[c.member_id].tasks[key].points += c.points;
      });
      
      list.innerHTML = Object.values(grouped).filter(g => Object.keys(g.tasks).length > 0).map(member => `
        <div class="member-group">
          <div class="member-group-header">
            <div class="avatar">${member.avatar}</div>
            <div class="member-group-name">${member.name}</div>
          </div>
          <div class="member-group-body">
            ${Object.entries(member.tasks).map(([task, stats]) => `
              <div class="task-summary">
                <span>${task}</span>
                <span>${stats.count}次 · ${stats.points}积分</span>
              </div>`).join('')}
          </div>
        </div>`).join('') || '<div class="empty-state">暂无记录</div>';
    }
    
    document.getElementById('completion-date').addEventListener('change', loadTodayCompletions);
  </script>
